[package]
name = "palacan-crypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crittografia di Palacan: vodozemac (Olm/Megolm) con l'interfaccia di libolm, per il browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.1", features = ["libolm-compat"] }
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
wasm-bindgen = "0.2"
js-sys = "0.3"
# [palacan-pq1] post-quantum: ML-KEM-768 (libcrux, la stessa di Signal; solo 768) e la busta PQ.
# chacha20poly1305 / hkdf / sha2 0.11 / getrandom / zeroize: le stesse versioni gia' usate da vodozemac.
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2-pq = { package = "sha2", version = "0.11" }
getrandom = "0.4"
zeroize = "1"
# [palacan-pq5a] firme post-quantum: ML-DSA-65 (FIPS 204) di libcrux (Cryspen), versione fissata, solo 65.
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["mldsa65"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
vodozemac = { version = "=0.11.1", features = ["libolm-compat", "wasm_js"] }

[dev-dependencies]
# [palacan-pq6b] prove per proprieta' (tests/proprieta_pq.rs): migliaia di input casuali, ridotti al caso minimo
proptest = "1"

# [palacan-pq6b] "kani" e' il cfg del model checker Kani (dimostrazioni in src/formato_pq.rs, eseguite nella CI)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
