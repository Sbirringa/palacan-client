# nginx.conf - Configurazione Nginx per servire l'applicazione React

server {
    # Nginx ascolterà sulla porta 8080 all'interno del container
    listen 8080;
    listen [::]:8080; # Ascolta anche su IPv6

    # Il nome del server può essere un wildcard per Fly.io
    server_name _; 

    # Imposta la directory radice da cui Nginx servirà i file
    # Questa è la directory dove il Dockerfile ha copiato i file 'dist'
    root /usr/share/nginx/html;

    # Definisce i file di indice da cercare quando viene richiesta una directory
    index index.html index.htm;

    # [palacan-l1a] intestazioni di sicurezza su ogni risposta. ATTENZIONE: un blocco location con un suo add_header
    # non eredita quelle del server, quindi ogni blocco con add_header le include di nuovo.
    include /etc/nginx/palacan-intestazioni.conf;

    # Abilita la compressione Gzip per migliorare le performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    # Configurazione per servire i file statici e gestire il routing di React
    location / {
        # Prova a servire il file richiesto, altrimenti fallback a index.html
        # Questo è fondamentale per il routing lato client di React (es. React Router)
        try_files $uri $uri/ /index.html;
    }
    # Nuovo (sessione corrente): index.html NON deve mai essere tenuto in
    # cache dal browser - e' l'unico file che dice al client quale bundle
    # JS/CSS caricare (i bundle hanno nomi con hash diverso ad ogni build,
    # quindi possono restare cachati a lungo senza problemi, vedi sotto).
    # Senza questa regola esplicita, un browser (soprattutto mobili) puo'
    # restare bloccato su una index.html vecchia dopo un deploy, quindi
    # su un bundle JS vecchio, anche dopo un ricaricamento normale della
    # pagina - osservato in produzione stasera.
    location = /index.html {
        include /etc/nginx/palacan-intestazioni.conf;
        include /etc/nginx/palacan-csp.conf;  # [palacan-l1a] la Content-Security-Policy vale per la pagina
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Impostazioni di caching per i file statici con estensioni specifiche
    # Migliora le performance del frontend memorizzando in cache i file sul browser del client
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M; # I file scadono dopo 1 mese
        access_log off; # Non registrare gli accessi per questi file
        add_header Cache-Control "public"; # Permetti la cache da parte di proxy e browser
        include /etc/nginx/palacan-intestazioni.conf;  # [palacan-l1a]
    }

    location ~* \.(?:css|js)$ {
        expires 1y; # I file scadono dopo 1 anno
        access_log off; # Non registrare gli accessi per questi file
        add_header Cache-Control "public"; # Permetti la cache da parte di proxy e browser
        include /etc/nginx/palacan-intestazioni.conf;  # [palacan-l1a]
    }

    # [palacan-l1c] firma dell'elenco: mai in cache (cambia a ogni pubblicazione, il nome resta uguale)
    location /rilascio/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/palacan-intestazioni.conf;
    }

    # [palacan-l1b] elenco delle impronte della build: mai in cache (cambia a ogni pubblicazione, il nome resta uguale)
    location = /palacan-impronte.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/palacan-intestazioni.conf;
    }

    # Gestione degli errori (opzionale, ma buona pratica)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
